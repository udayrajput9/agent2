{% extends "base.html" %}

{% block title %}Log In - AI Trip Planner{% endblock %}

{% block content %}
<div class="glass-panel auth-container">
    <h2>Welcome Back</h2>
    {% if error %}
    <p style="color: #ef4444; margin-bottom: 1rem;">{{ error }}</p>
    {% endif %}
    <form action="/login" method="POST" id="login-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="explorer_01">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Log In</button>
    </form>
    <div class="auth-footer">
        Don't have an account? <a href="/signup">Sign up here</a>.
    </div>
</div>
{% endblock %}
